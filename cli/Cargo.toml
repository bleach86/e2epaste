[package]
name = "e2ep"
version = "0.1.0"
edition = "2021"
description = "Command-line client for e2ePaste: end-to-end encrypted pastes, encrypted on your machine"
license = "MIT"
publish = false

[[bin]]
name = "e2ep"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
e2epaste-format = { path = "../crates/e2epaste-format" }
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
hkdf = "0.13.0"
pbkdf2 = "0.13.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "http2", "rustls-no-provider"] }
rmcp = { version = "3.6.0", features = ["server", "transport-io", "macros"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std"] }
url = "2.5.8"
