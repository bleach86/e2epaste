# Settings for every profile. Any key can be overridden with an environment
# variable: ROCKET_<KEY>, e.g. ROCKET_SITE_URL=https://paste.example.com
[default]
# Only reachable from this machine, by the reverse proxy. Use 0.0.0.0 if the
# proxy runs on another machine (the Docker image sets that itself).
address = "127.0.0.1"
port = 8001

# The site's public address. Used for canonical links, the sitemap and link
# previews. Set it to your own domain, with https:// and no trailing path.
site_url = "http://localhost:8001"

# Where the paste database (paste_db/) and attachments (file_store/) are kept.
data_dir = "."

# Front-end files served at /public, and the page templates.
static_dir = "static"
template_dir = "templates"

# Header holding the visitor's IP, set by the reverse proxy. The rate limits
# below are per IP, so the proxy must set (overwrite) it on every request.
ip_header = "X-Real-IP"

# Limits per visitor IP (IPv6: per /64). 0 turns a limit off.
pastes_per_minute = 10
pastes_per_hour = 60
# Attachment data. At least 26, the largest attachment.
upload_mib_per_hour = 250

# Failed attempts to open or delete a paste (wrong link, password or delete
# link) allowed per IP per hour. Correct attempts are never limited.
unlock_attempts_per_hour = 30

# Enables the admin API (POST /api/admin/delete/<id>) for taking pastes down.
# Leave unset to disable it. Generate one with `openssl rand -hex 32`, and set
# it with ROCKET_ADMIN_TOKEN rather than in this file.
# admin_token = ""

# Storage limits. 0 turns a limit off.
# Stop taking new pastes when the disk has less than this free.
min_free_disk_mib = 1024
# Cap on the total size of all attachments.
max_attachment_storage_mib = 0

[default.limits]
# Encrypted pastes are at most about 1.4 MiB (1 MB of text). Attachments are
# uploaded separately and capped at 26 MiB.
json = "4 MiB"
