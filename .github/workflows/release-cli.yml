name: Release e2ep

# Push a tag like cli-v0.1.0 (matching cli/Cargo.toml's version) to build e2ep
# for Linux, macOS and Windows and publish a GitHub release with SHA256SUMS.
# Run by hand (workflow_dispatch) to build without releasing.
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version' cli/Cargo.toml | cut -d '"' -f2)
          if [ "$GITHUB_REF_NAME" != "cli-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match cli/Cargo.toml's version $version"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static (musl) builds run on any Linux.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cross

      # Only the client: the server's build script (npm, webpack) doesn't run.
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked -p e2ep --target ${{ matrix.target }}
          else
            cargo build --release --locked -p e2ep --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#cli-}"
          name="e2ep-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          exe=e2ep
          if [ "${{ runner.os }}" = "Windows" ]; then exe=e2ep.exe; fi
          cp "target/${{ matrix.target }}/release/$exe" LICENSE cli/README.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: e2ep-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
      - name: Checksums
        run: |
          mkdir dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "e2ep ${GITHUB_REF_NAME#cli-}" \
            --notes "The e2ep command-line client. Check downloads against SHA256SUMS."
