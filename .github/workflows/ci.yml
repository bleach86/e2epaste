name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  # Weekly, so new security advisories for the dependencies show up even
  # when nothing is pushed.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to commits; the comment is the tag the commit carries.
# Dependabot (.github/dependabot.yml) keeps both up to date.
jobs:
  rust:
    name: Rust (format, lint, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # build.rs runs npm ci and webpack.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The server, the e2ep client and the format crate they share.
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  browser:
    name: JavaScript and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The server and e2ep (tests/e2e/cli.mjs). The server's build also
      # installs the site's npm packages and builds the bundles.
      - run: cargo build --locked --workspace
      - run: npm ci --prefix tests

      - name: JavaScript unit tests
        run: npm test
      # Chrome comes with the GitHub runner image.
      - name: Browser tests
        run: npm run test:e2e
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
      - name: Keep screenshots from a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; "unmaintained" notices are only warnings.
      - run: cargo audit
      # Only what's sent to browsers; build tools don't ship.
      - run: npm audit --omit=dev --audit-level=moderate

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: e2epaste:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Start the image the way docker-compose.yml does (read-only root, no
      # capabilities, a throwaway /data) and check that it serves pages.
      - name: Smoke test
        run: |
          data=$(mktemp -d)
          chmod 777 "$data"
          docker run -d --name e2epaste \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:8001:8001 \
            -e ROCKET_SITE_URL=http://localhost:8001 \
            -v "$data":/data \
            e2epaste:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8001/api/limits; then break; fi
            if [ "$i" = 30 ]; then
              echo "::error::The server didn't come up"
              docker logs e2epaste
              exit 1
            fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8001/
          curl -fsS http://127.0.0.1:8001/api/limits
          echo
          # The image's own HEALTHCHECK must pass too.
          for i in $(seq 1 45); do
            status=$(docker inspect --format '{{.State.Health.Status}}' e2epaste)
            if [ "$status" = healthy ]; then break; fi
            if [ "$i" = 45 ]; then
              echo "::error::Health check status is '$status', not healthy"
              exit 1
            fi
            sleep 2
          done
      - name: Server logs
        if: always()
        run: docker logs e2epaste 2>&1 || true
      - name: Stop the server
        if: always()
        run: docker rm -f e2epaste > /dev/null 2>&1 || true
