name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  # Weekly, so new security advisories for the dependencies show up even
  # when nothing is pushed.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (format, lint, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # build.rs runs npm ci and webpack.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The server, the e2ep client and the format crate they share.
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked -p e2epaste --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked -p e2epaste --no-default-features

  browser:
    name: JavaScript and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The server and e2ep (tests/e2e/cli.mjs). The server's build also
      # installs the site's npm packages and builds the bundles.
      - run: cargo build --locked --workspace
      - run: npm ci --prefix tests

      - name: JavaScript unit tests
        run: npm test
      # Chrome comes with the GitHub runner image.
      - name: Browser tests
        run: npm run test:e2e
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
      - name: Keep screenshots from a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; "unmaintained" notices are only warnings.
      - run: cargo audit
      # Only what's sent to browsers; build tools don't ship.
      - run: npm audit --omit=dev --audit-level=moderate

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
