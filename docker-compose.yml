# Settings come from .env (copy .env.example). See README.md for HTTPS setup.
services:
  e2epaste:
    build: .
    image: e2epaste
    restart: unless-stopped
    environment:
      ROCKET_SITE_URL: ${SITE_URL:-http://localhost:8001}
      ROCKET_SITE_NAME: ${SITE_NAME:-}
      ROCKET_MAX_PASTE_KIB: ${MAX_PASTE_KIB:-1024}
      ROCKET_ALLOW_FILES: ${ALLOW_FILES:-true}
      ROCKET_MAX_FILE_MIB: ${MAX_FILE_MIB:-25}
      # Empty turns the admin API off.
      ROCKET_ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      # Only reachable from this machine: put a reverse proxy with HTTPS in
      # front. Browsers won't run the encryption on plain HTTP.
      - "127.0.0.1:${PORT:-8001}:8001"
    volumes:
      - e2epaste-data:/data
    # The server only writes under /data (the database and attachments), so
    # the rest of the file system is read-only. It needs no capabilities: it
    # runs as user 10001 on a port above 1024.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The same check as the image's HEALTHCHECK: fetch /api/limits with bash.
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8001 && printf 'GET /api/limits HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n' >&3 && read -r status <&3 && case \"$$status\" in *' 200 '*) exit 0;; esac; exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  e2epaste-data:
